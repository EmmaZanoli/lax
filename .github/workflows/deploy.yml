name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy Pages alla volta, ma NON cancellare quelli in corso: cancellare
# un deploy Pages a metà può lasciare la pipeline di GitHub incastrata
# (deployment_queued perenne). È la configurazione raccomandata da GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # La pipeline di GitHub Pages a volte è molto lenta a prendere in
          # carico il deployment (anche >10 min): col timeout di default (10 min)
          # il deploy si autoabortiva pur senza errori, restando "deployment_queued".
          # 30 min di margine per gli intoppi lato GitHub. (valore in millisecondi)
          timeout: 1800000